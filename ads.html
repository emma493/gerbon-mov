<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unlock more content</title>
<meta name="theme-color" content="#FF2B55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --scrim:#0a0a0f;
    --card:#ffffff;
    --title:#1f1f1f;
    --text:#5f6368;
    --border:#dadce0;
    --accent:#FF2B55;
    --option-bg:#ffffff;
    --option-hover:#f6f9fe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Plus Jakarta Sans","Poppins",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(60% 45% at 85% 8%, rgba(255,43,85,.32) 0%, rgba(255,43,85,0) 70%),
      radial-gradient(55% 40% at 10% 95%, rgba(255,43,85,.18) 0%, rgba(255,43,85,0) 70%),
      linear-gradient(180deg,#14141c 0%,#0a0a0f 55%,#050508 100%);
    background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .card{
    width:100%;max-width:360px;
    background:var(--card);
    border-radius:16px;
    padding:20px 18px 18px;
    box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    animation:pop .25s ease-out;
  }
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .option{box-shadow:0 1px 3px rgba(255,43,85,.12)}
  .option:hover{border-color:var(--accent)}
  .btn{box-shadow:0 4px 14px rgba(255,43,85,.35)}
  .perks{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:11px;font-weight:600;color:var(--text)}
  .perks b{color:var(--accent);font-weight:800}
  h1{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.6px;color:var(--title);text-align:center;margin-bottom:10px}
  .title-group{text-align:center;margin-bottom:18px}
  .title-line-1{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--title);margin-bottom:6px}
  .title-line-2{font-size:13.5px;font-weight:500;line-height:1.5;color:var(--text)}
  .highlight{font-weight:800;color:var(--accent)}
  .option{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--option-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;text-align:left;font:inherit;text-decoration:none;color:inherit;
    transition:background .15s;
  }
  .option:hover,.option:focus-visible{background:var(--option-hover);outline:none}
  .option .t{font-size:16px;font-weight:800;letter-spacing:-.2px;color:var(--title)}
  .option .d{font-size:12.5px;font-weight:600;color:var(--text);margin-top:3px}
  .play{
    flex:none;width:22px;height:22px;border-radius:50%;
    background:var(--accent);display:grid;place-items:center;
  }
  .play svg{width:10px;height:10px;fill:#fff;margin-left:1px}
  .back{display:block;text-align:center;margin-top:16px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}

</style>
</head>
<body>

<main class="card" id="gate" role="dialog" aria-labelledby="ttl">
  <!-- Static unlock card -->
  <section id="offer">
    <div class="title-group">
      <div class="title-line-1">Unlock full access</div>
      <div class="title-line-2">You will be redirected back to <span class="highlight">gerbonmovies.site</span> when you finish watching the Ad</div>
    </div>
    <a class="option" id="viewAd" href="https://shrinkme.click/gerbonmovies">
      <span>
        <div class="t">Watch a short ad</div>
        <div class="d">Watch ad to unlock 24 hours</div>
      </span>
      <span class="play" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M0 0l10 5-10 5z"/></svg></span>
    </a>
    <div class="perks"><span><b>24h</b> full access</span><span><b>1</b> short ad</span><span><b>Free</b></span></div>
  </section>

</main>

<script>
(function(){
  var ACCESS_HOURS = 24;             // how long access lasts
  var STORAGE_KEY = 'unlock_expiry'; // read this key on index.html
  var SHRINKME_URL = 'https://shrinkme.click/gerbonmovies';

  var $ = function(id){return document.getElementById(id)};

  function hasAccess(){
    try{ return Number(localStorage.getItem(STORAGE_KEY)) > Date.now(); }
    catch(e){ return false; }
  }
  function grant(){
    try{ localStorage.setItem(STORAGE_KEY, String(Date.now() + ACCESS_HOURS*3600*1000)); }catch(e){}
  }

  // Already unlocked? send them to the main site, not the ad gate.
  if(hasAccess()){ location.replace('index.html'); return; }

  // Block the back button: every time they try to pop back, push forward again.
  history.pushState(null, null, location.href);
  window.addEventListener('popstate', function(){
    history.pushState(null, null, location.href);
  });

  // Clicking opens the ad in the SAME tab (no new tab) and replaces this page
  // in history so the back button cannot return to ads.html.
  $('viewAd').addEventListener('click', function(e){
    e.preventDefault();
    grant();

    // Reset the ad-break scroll counter so the user doesn't immediately
    // hit the threshold again when they return from the ad.
    try{
      sessionStorage.setItem('scrollCount', '0');
      sessionStorage.setItem('targetScrolls', String(Math.floor(Math.random() * 6) + 10));
      sessionStorage.setItem('shortxx_adbreak_return', '1');
    }catch(e){}

    location.replace(SHRINKME_URL);
  });
})();
</script>
</body>
</html>
