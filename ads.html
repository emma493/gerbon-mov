<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ad Break - Gerbon Movies</title>
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #ff2b55;
            border-radius: 50%;
            margin-bottom: 24px;
            box-shadow: 0 0 20px 4px rgba(255, 43, 85, 0.7);
            animation: sx-adbreak-pulse 2s ease-in-out infinite;
        }
        @keyframes sx-adbreak-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.4); opacity: 0.65; }
        }
        #adBtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #ff2b55 0%, #d60045 100%);
            border: none;
            border-radius: 56px;
            padding: 20px 40px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow:
                0 0 34px rgba(255, 43, 85, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            min-width: 260px;
            -webkit-tap-highlight-color: transparent;
        }
        #adBtn::before {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        #adBtn:hover::before { transform: translateX(100%); }
        #adBtn:hover {
            background: linear-gradient(135deg, #ff4d7a 0%, #ff2b55 100%);
            transform: scale(1.08);
            box-shadow: 0 0 44px rgba(255, 43, 85, 0.9);
        }
        #adBtn:active { transform: scale(0.94); }
        .icon { font-size: 26px; }
        .sub {
            margin-top: 26px;
            font-size: 12px;
            color: #8a8a8a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            animation: sx-adbreak-hint-blink 2s ease-in-out infinite;
        }
        @keyframes sx-adbreak-hint-blink {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }
        @media (max-width: 480px) {
            #adBtn { padding: 18px 28px; font-size: 18px; min-width: 220px; }
        }
    </style>
</head>
<body>
    <div class="dot"></div>
    <button id="adBtn" type="button">
        <span class="icon">▶</span>
        <span>Watch Now</span>
    </button>
    <div class="sub">Ad Break</div>

    <script>
        const SMARTLINK_URL = "https://your-adsterra-smartlink.com/go"; // <-- REPLACE WITH YOUR ADSTERRA SMARTLINK

        // Mark that we're returning from an ad break so index.html won't redirect again immediately.
        sessionStorage.setItem("shortxx_adbreak_return", "1");

        const btn = document.getElementById("adBtn");
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            try { window.open(SMARTLINK_URL, "_blank"); } catch (e) {}
            // Return to the main feed after clicking.
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
