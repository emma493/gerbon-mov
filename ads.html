<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerbon Movies - Ad Break</title>
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: "Inter", sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .smartlink-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        .top-nav,
        .bottom-info {
            z-index: 10;
            pointer-events: none;
        }

        .logo,
        .sponsored-btn,
        .skip-ad-btn {
            pointer-events: auto;
        }

        .bottom-info {
            position: absolute;
            bottom: 80px;
            left: 15px;
            width: calc(100% - 30px);
        }

        .user-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sponsored-btn,
        .skip-ad-btn {
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            cursor: pointer;
        }

        .sponsored-btn {
            background-color: #ff2b54;
            box-shadow: 0 4px 15px rgba(255, 43, 84, 0.3);
        }

        .skip-ad-btn {
            background-color: #1b5e20;
            position: relative;
            box-shadow: 0 4px 15px rgba(27, 94, 32, 0.3);
            opacity: 0;
            transform: translateY(30px);
            animation: pullUpEntrance 0.6s ease forwards 5s,
                breathingSize 2.5s infinite ease-in-out 5.6s;
        }

        @keyframes breathingSize {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes pullUpEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        .skip-ad-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 4px;
            border: 2px solid rgba(46, 204, 113, 0.6);
            animation: rippleOut 2s infinite;
            pointer-events: none;
        }

        @keyframes rippleOut {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2, 1.3); opacity: 0; }
        }

        .bubble {
            position: absolute;
            width: 6px; height: 6px;
            background: #2ecc71;
            border-radius: 50%;
            filter: blur(1px);
            box-shadow: 0 0 8px #2ecc71;
        }

        .b-tl { top: -3px; left: -3px; }
        .b-br { bottom: -3px; right: -3px; }

        .live-icon {
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
        }

        @media (min-width: 1024px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
            }
            .video-container {
                height: 100vh;
                aspect-ratio: 9 / 16;
                width: auto;
                position: relative;
                overflow: hidden !important;
                background: #111;
            }
            .top-nav {
                width: 100% !important;
                left: 0 !important;
                transform: none !important;
                padding: 0 20px;
                top: 25px;
            }
        }

        .logo { width: 103px; height: 26px; }

        .for-you {
            font-weight: 700;
            font-size: 18px;
            color: #ff2b54;
        }
    </style>
</head>

<body data-page="ads" data-next="index.html" data-prev="index.html">

    <div class="video-container">
        <iframe src="https://araplhn.org/4/f4da12d7aaa67cd61f6a1196381da654"
            class="smartlink-iframe" title="Sponsored Content"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
        </iframe>
        <div class="top-nav">
            <a href="https://gerbonmovies.site/" style="text-decoration: none;">
                <img src="logo.png" alt="Logo" class="logo">
            </a>
            <a href="https://gerbonmovies.site/" style="text-decoration: none;">
                <div class="for-you">Sponsored</div>
            </a>
            <a href="https://gerbonmovies.site/" style="text-decoration: none;">
                <div class="live-icon"><i class="fas fa-tv"></i> LIVE</div>
            </a>
        </div>

        <div class="bottom-info">
            <div class="user-name">Sponsored <i class="fas fa-check-circle" style="color:#20D5EC; font-size: 14px;"></i>
            </div>

            <div class="action-row">
                <a href="https://araplhn.org/4/f4da12d7aaa67cd61f6a1196381da654"
                    target="_blank" class="sponsored-btn">Learn More</a>

                <div id="skip-btn" class="skip-ad-btn">
                    <div class="bubble b-tl"></div>
                    <div class="bubble b-br"></div>
                    <span>Skip Ad</span>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        sessionStorage.setItem("shortxx_adbreak_return", "1");

        document.getElementById('skip-btn').addEventListener('click', function () {
            window.location.href = document.body.dataset.next || 'index.html';
        });

        const btn = document.getElementById('skip-btn');
        btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.95)');
        btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
    </script>
</body>

</html>
